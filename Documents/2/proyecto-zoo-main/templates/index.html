<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <title>Zoologico Animalesco</title>
</head>

<body>

    <h1>Bienvenido al Zoologico Animalesco</h1>

    <h2>Lista de animales</h2>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Especie</th>
            <th>Color</th>
        </tr>

        {% for animal in animales %}

        <tr>
            <td>{{ animal[0] }}</td>
            <td>{{ animal[1] }}</td>
            <td>{{ animal[2] }}</td>
            <td>{{ animal[3] }}</td>
        </tr>

        {% endfor %}

    </table>

</body>
</html>
